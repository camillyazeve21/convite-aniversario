<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite de Aniversário - Monstros S.A.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap');
        
        @font-face {
            font-family: 'Waltograph';
            src: url('https://cdn.jsdelivr.net/gh/mrbubbles/waltograph-font@master/WaltographUI-Bold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            /* Imagem de fundo enviada (fundo.jpg) cobrindo toda a tela */
            background-color: #0b1329;
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: 'Roboto', sans-serif;
            box-sizing: border-box;
        }

        /* Camada escura semitransparente por cima do fundo para destacar o convite */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .cartao-convite {
            position: relative;
            z-index: 2;
            
            /* Fundo escuro/lousa igual à referência */
            background-color: #1a1a1a;
            width: 100%;
            max-width: 420px;
            
            /* Borda azul grossa com traço interno tracejado */
            border: 10px solid #2882c9;
            border-radius: 35px;
            padding: 35px 20px;
            text-align: center;
            box-sizing: border-box;
            
            box-shadow: 
                inset 0 0 0 4px rgba(40, 130, 201, 0.5),
                inset 0 0 25px rgba(0, 0, 0, 0.8),
                0 20px 40px rgba(0,0,0,0.7);
        }

        /* Título Principal no estilo Monstros S.A. */
        h1 {
            font-family: 'Waltograph', sans-serif;
            font-size: 3em;
            color: #2882c9;
            margin: 0 0 15px 0;
            line-height: 1;
            text-shadow: 2px 2px 0px #82c933, 0 0 10px rgba(40, 130, 201, 0.4);
        }

        /* Foto dos gêmeos centralizada */
        .foto-convite {
            width: 100%;
            max-width: 190px;
            height: 190px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #2882c9;
            margin: 10px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .nomes-gemeos {
            font-family: 'Waltograph', sans-serif;
            font-size: 2em;
            color: #ffffff;
            margin: 12px 0 3px 0;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #2882c9;
        }

        .texto-destaque {
            color: #82c933;
            font-size: 1em;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .data-horario {
            color: #ffffff;
            font-size: 1.35em;
            font-weight: 900;
            margin: 15px 0;
            line-height: 1.3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .rotulo-info {
            color: #2882c9;
            font-size: 0.8em;
            font-weight: 700;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .valor-info {
            color: #ffffff;
            font-size: 1.2em;
            font-weight: 900;
            text-transform: uppercase;
            margin: 3px 0;
        }

        .rodape-destaque {
            color: #82c933;
            font-size: 0.85em;
            font-weight: 900;
            margin-top: 20px;
            text-transform: uppercase;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .rodape-sub {
            color: #aaaaaa;
            font-size: 0.7em;
            font-weight: 700;
            margin-top: 6px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Camada de escurecimento para destacar o cartão -->
    <div class="overlay"></div>

    <div class="cartao-convite">
        
        <h1>Monstros S.A.</h1>
        
        <!-- Foto dos gêmeos no meio -->
        <img src="hh.png" alt="Helena e Henrique" class="foto-convite">

        <div class="nomes-gemeos">Helena & Henrique</div>
        <div class="texto-destaque">fazem 1 aninho!</div>

        <div class="data-horario">
            16 DE AGOSTO<br>ÀS 19H
        </div>

        <div class="rotulo-info">LOCAL</div>
        <div class="valor-info">ATRÁS DO CASTELINHO</div>
        <div class="valor-info" style="font-size: 0.95em; margin-top: 2px;">REFÚGIO - GTA RP</div>

        <div class="rodape-destaque">
            TRAGA SUA MELHOR RISADA,<br>ELA É NOSSA ENERGIA!
        </div>
        
        <div class="rodape-sub">
            CONFIRME PRESENÇA E VENHA COMEMORAR
        </div>

    </div>

</body>
</html>
