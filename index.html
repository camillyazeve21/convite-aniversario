<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite de Aniversário - Monstros S.A.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap');
        
        @font-face {
            font-family: 'MonsterAG';
            src: url('Monster AG.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            background-color: #0b1329;
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: 'Roboto', sans-serif;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .cartao-convite {
            position: relative;
            z-index: 2;
            background-color: #1a1a1a;
            width: 100%;
            max-width: 480px;
            
            border: 10px solid #2882c9;
            border-radius: 40px;
            padding: 40px 25px;
            text-align: center;
            box-sizing: border-box;
            
            box-shadow: 
                inset 0 0 0 4px rgba(40, 130, 201, 0.5),
                inset 0 0 30px rgba(0, 0, 0, 0.9),
                0 25px 50px rgba(0,0,0,0.8);
        }

        h1 {
            font-family: 'MonsterAG', sans-serif;
            font-size: 2.8em;
            color: #2882c9;
            margin: 0 0 10px 0;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #82c933, 0 0 12px rgba(40, 130, 201, 0.5);
            letter-spacing: 1px;
        }

        .foto-convite {
            width: 100%;
            max-width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #2882c9;
            margin: 8px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .nomes-gemeos {
            font-family: 'MonsterAG', sans-serif;
            font-size: 1.9em;
            color: #ffffff;
            margin: 10px 0 2px 0;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #2882c9;
        }

        .texto-destaque {
            color: #82c933;
            font-size: 1.05em;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .bloco-data-horario {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
            position: relative;
            padding: 10px 0;
            border-top: 2px dashed rgba(40, 130, 201, 0.3);
            border-bottom: 2px dashed rgba(40, 130, 201, 0.3);
        }

        .bloco-data-horario::after {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 50%;
            width: 2px;
            border-left: 2px dotted #82c933;
            transform: translateX(-50%);
        }

        .item-dh {
            width: 50%;
            text-align: center;
            color: #ffffff;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.15em;
            line-height: 1.3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .item-dh span {
            display: block;
            color: #2882c9;
            font-size: 0.8em;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        .bloco-endereco {
            margin: 20px 0;
            background-color: #2882c9;
            padding: 14px;
            border-radius: 15px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .rotulo-info {
            color: #ffffff;
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .valor-info {
            color: #ffffff;
            font-size: 1.15em;
            font-weight: 900;
            text-transform: uppercase;
            margin: 2px 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .rodape-destaque {
            background-color: #2882c9;
            color: #ffffff;
            font-size: 0.9em;
            font-weight: 900;
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #ffffff;
            text-transform: uppercase;
            line-height: 1.4;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .rodape-sub {
            color: #cccccc;
            font-size: 0.75em;
            font-weight: 700;
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* Sully e Mike no canto inferior direito */
        .personagens-lateral {
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 135px;
            height: auto;
            z-index: 10;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.7));
        }

        /* Boo no canto superior esquerdo (tamanho menor) */
        .boo-superior-esquerda {
            position: absolute;
            top: -25px;
            left: -25px;
            width: 70px;
            height: auto;
            z-index: 10;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.7));
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="cartao-convite">
        
        <!-- Sully e Mike na direita -->
        <img src="sully e mike.png" alt="Sully e Mike" class="personagens-lateral">
        
        <!-- Boo menor no canto superior esquerdo -->
        <img src="boo.png" alt="Boo" class="boo-superior-esquerda">

        <h1>Monstros S.A.</h1>
        
        <!-- Foto dos gêmeos -->
        <img src="hh.png" alt="Helena e Henrique" class="foto-convite">

        <div class="nomes-gemeos">Helena & Henrique</div>
        <div class="texto-destaque">fazem 1 aninho!</div>

        <!-- Data e Horário -->
        <div class="bloco-data-horario">
            <div class="item-dh">
                <span>Data</span>
                16 de<br>Agosto
            </div>
            <div class="item-dh">
                <span>Horário</span>
                19:00<br>Horas
            </div>
        </div>

        <!-- Endereço -->
        <div class="bloco-endereco">
            <div class="rotulo-info">Local</div>
            <div class="valor-info">Atrás do Castelinho</div>
            <div class="valor-info" style="font-size: 0.95em; color: #82c933;">Refúgio - GTA RP</div>
        </div>

        <!-- Frase customizada -->
        <div class="rodape-destaque">
            Venha de fantasia e embarque nessa aventura em Monstrópolis!
        </div>
        
        <div class="rodape-sub">
            Confirme presença e venha comemorar
        </div>

    </div>

</body>
</html>
